<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Patsy's Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f3f7f7;--ink:#1d2a2a;--soft:#566463;--desk:#5e98a2;--desk2:#4c838d;--paper:#fff;--line:#d9e2e1;--gold:#e0a526;--red:#9c3b2c;--ok:#2f7a4b}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Nunito Sans",system-ui,sans-serif}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.1;margin:0}
h1{font-size:28px}h2{font-size:23px}
header{background:var(--desk2);color:#fff}
.bar{max-width:900px;margin:0 auto;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.bar h1{margin-inline-end:auto;font-size:22px}
.bar a,.bar button{color:#fff;font-weight:700}
main{max-width:900px;margin:0 auto;padding:20px 16px 120px;display:grid;gap:22px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:14px}
.help{color:var(--soft);font-size:16px;margin:0}
label{display:grid;gap:4px;font-weight:700;font-size:15px}
input[type=text],input[type=number],input[type=password],select{font:inherit;font-size:17px;min-height:48px;padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.money{position:relative}.money span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--soft);font-weight:700}.money input{padding-left:26px}
.btn{min-height:48px;padding:0 22px;border-radius:999px;border:0;font:700 17px "Nunito Sans",sans-serif;cursor:pointer;background:var(--gold);color:#2a1d00}
.btn.plain{background:transparent;color:inherit;box-shadow:inset 0 0 0 2px currentColor}
.linkbtn{background:none;border:0;padding:8px 0;font:inherit;cursor:pointer;text-decoration:underline}
.login{max-width:420px;margin:8vh auto 0}
.err{color:var(--red);font-weight:700;margin:0}
.item{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0;padding-top:0}
.item img{width:96px;height:96px;object-fit:cover;border-radius:8px;background:#e8eeee}
.item.gone img{opacity:.45}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fields .wide{grid-column:1/-1}
.toggles{display:flex;flex-wrap:wrap;gap:10px;grid-column:1/-1}
.tog{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1.5px solid var(--line);border-radius:999px;font-weight:700;cursor:pointer;user-select:none}
.tog input{width:20px;height:20px;margin:0}
.tog.sold:has(input:checked){border-color:var(--red);color:var(--red);background:#fbefec}
.tog.hide:has(input:checked){border-color:var(--soft);background:#eef1f1}
.packs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.save{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.08)}
.save .in{max-width:900px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.status{margin-inline-end:auto;font-weight:700}
.status.dirty{color:var(--red)}.status.ok{color:var(--ok)}
.tag{font-size:13px;font-weight:700;color:var(--soft)}
@media(max-width:560px){.item{grid-template-columns:64px minmax(0,1fr)}.item img{width:64px;height:64px}.fields,.packs{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<header><div class="bar">
  <h1>Little Garden Art: Dashboard</h1>
  <a href="/" target="_blank" rel="noopener">View my site</a>
  <button class="linkbtn" type="button" id="out" hidden>Sign out</button>
</div></header>

<main id="app">
  <p class="help">Loading&hellip;</p>
</main>

<div class="save" id="saveBar" hidden><div class="in">
  <span class="status" id="status">All changes saved</span>
  <button class="btn plain" type="button" id="undo">Undo changes</button>
  <button class="btn" type="button" id="save">Save changes</button>
</div></div>

<template id="loginT">
  <form class="box login" id="loginF" autocomplete="on">
    <h2>Welcome, Patsy</h2>
    <p class="help">Sign in to change prices, sizes, and mark paintings as sold.</p>
    <label>Password<input type="password" id="pw" name="password" autocomplete="current-password" required></label>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn" type="submit">Sign in</button>
  </form>
</template>

<script>
{
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img=f=>'/img/'+String(f).replace(/[^a-z0-9._-]/gi,'');
const CATS=[['acrylic','Acrylic'],['watercolor','Watercolor'],['framed','Framed'],['little','Little one']];
let data=null,saved='',busy=false;

async function api(path,opts={}){
  const r=await fetch(path,{credentials:'same-origin',headers:{'content-type':'application/json'},cache:'no-store',...opts});
  let body={};try{body=await r.json()}catch(_){}
  return {ok:r.ok,status:r.status,body};
}

async function start(){
  const s=await api('/api/login');
  if(!s.ok){app.innerHTML='<p class="err">Can’t reach the site right now. Refresh in a minute.</p>';return}
  if(!s.body.ready){app.innerHTML='<div class="box"><h2>Almost ready</h2><p class="help">The dashboard password hasn’t been set yet. Ask Trevor to finish setup.</p></div>';return}
  s.body.signedIn?load():showLogin();
}

function showLogin(){
  $('#out').hidden=true;$('#saveBar').hidden=true;
  app.innerHTML='';app.append($('#loginT').content.cloneNode(true));
  $('#pw').focus();
  $('#loginF').addEventListener('submit',async e=>{
    e.preventDefault();const err=$('#loginErr');err.textContent='';
    const r=await api('/api/login',{method:'POST',body:JSON.stringify({password:$('#pw').value})});
    if(r.ok)load();else err.textContent=r.status===429?'Too many tries. Wait a minute and try again.':(r.body.error||'Sign-in failed.');
  });
}

async function load(){
  const r=await api('/api/catalog?admin=1');
  if(!r.ok||!r.body.art){app.innerHTML='<p class="err">Couldn’t load your paintings. Refresh to try again.</p>';return}
  data=r.body;saved=JSON.stringify(data);$('#out').hidden=false;$('#saveBar').hidden=false;render();status();
}

function render(){
  app.innerHTML=`
  <section class="box">
    <h2>Christmas cards</h2>
    <label style="max-width:260px">Order-by date shown on the site<input type="text" data-k="deadline" value="${esc(data.deadline)}" maxlength="40"></label>
    ${data.cards.map((c,ci)=>`<div class="item${c.hidden?' gone':''}">
      <img src="${img(c.img)}" alt="">
      <div class="fields">
        <label class="wide">Card name<input type="text" data-c="${ci}" data-f="t" value="${esc(c.t)}" maxlength="80"></label>
        <div class="packs wide">${c.packs.map((p,pi)=>`<label>${esc(p.l)}<span class="money"><span>$</span><input type="number" inputmode="decimal" min="0" step="0.01" data-c="${ci}" data-p="${pi}" value="${p.p}"></span></label>`).join('')}</div>
        <div class="toggles"><label class="tog hide"><input type="checkbox" data-c="${ci}" data-f="hidden" ${c.hidden?'checked':''}>Hide from site</label></div>
      </div></div>`).join('')}
  </section>
  <section class="box">
    <h2>Paintings</h2>
    <p class="help">Change a price or size, tick <b>Sold</b> when one sells, then tap <b>Save changes</b> at the bottom.</p>
    ${data.art.map((a,ai)=>`<div class="item${a.sold||a.hidden?' gone':''}" id="a-${ai}">
      <img src="${img(a.img)}" alt="">
      <div class="fields">
        <label class="wide">Title<input type="text" data-a="${ai}" data-f="t" value="${esc(a.t)}" maxlength="80"></label>
        <label>Price<span class="money"><span>$</span><input type="number" inputmode="decimal" min="0" step="0.01" data-a="${ai}" data-f="p" value="${a.p}"></span></label>
        <label>Size<input type="text" data-a="${ai}" data-f="size" value="${esc(a.size)}" placeholder="e.g. 11 x 14 in" maxlength="40"></label>
        <label class="wide">Medium / details<input type="text" data-a="${ai}" data-f="m" value="${esc(a.m)}" maxlength="120"></label>
        <label>Shows under<select data-a="${ai}" data-f="c">${CATS.map(([k,l])=>`<option value="${k}" ${a.c===k?'selected':''}>${l}</option>`).join('')}</select></label>
        <div class="toggles">
          <label class="tog sold"><input type="checkbox" data-a="${ai}" data-f="sold" ${a.sold?'checked':''}>Sold</label>
          <label class="tog hide"><input type="checkbox" data-a="${ai}" data-f="hidden" ${a.hidden?'checked':''}>Hide from site</label>
        </div>
      </div></div>`).join('')}
  </section>
  ${data.updated?`<p class="tag">Last saved ${esc(new Date(data.updated).toLocaleString())}</p>`:''}`;
}

app.addEventListener('input',e=>{
  const t=e.target;if(!data||!t.matches('input,select'))return;
  const v=t.type==='checkbox'?t.checked:t.type==='number'?(t.value===''?'':Number(t.value)):t.value;
  if(t.dataset.k)data[t.dataset.k]=v;
  else if(t.dataset.p!=null)data.cards[+t.dataset.c].packs[+t.dataset.p].p=v;
  else if(t.dataset.c!=null)data.cards[+t.dataset.c][t.dataset.f]=v;
  else if(t.dataset.a!=null){const a=data.art[+t.dataset.a];a[t.dataset.f]=v;t.closest('.item').classList.toggle('gone',!!(a.sold||a.hidden))}
  status();
});

function bad(){
  const nums=[...data.cards.flatMap(c=>c.packs.map(p=>p.p)),...data.art.map(a=>a.p)];
  return nums.some(n=>n===''||!(Number(n)>=0));
}
function status(){
  const dirty=JSON.stringify(data)!==saved,st=$('#status');
  if(bad()){st.textContent='A price is blank';st.className='status dirty';$('#save').disabled=true;return}
  $('#save').disabled=!dirty||busy;$('#undo').hidden=!dirty;
  st.textContent=dirty?'You have unsaved changes':'All changes saved';st.className='status '+(dirty?'dirty':'ok');
}

$('#save').addEventListener('click',async()=>{
  if(busy||bad())return;busy=true;const st=$('#status');st.textContent='Saving…';st.className='status';$('#save').disabled=true;
  const r=await api('/api/catalog',{method:'PUT',body:JSON.stringify(data)});
  busy=false;
  if(r.status===401){st.textContent='Signed out. Sign in again; your changes were not saved.';showLogin();return}
  if(!r.ok){st.textContent=r.body.error||'Couldn’t save. Try again.';st.className='status dirty';$('#save').disabled=false;return}
  data=r.body;saved=JSON.stringify(data);render();status();
  st.textContent='Saved! Your site is updated.';
});
$('#undo').addEventListener('click',()=>{data=JSON.parse(saved);render();status()});
$('#out').addEventListener('click',async()=>{await api('/api/login',{method:'DELETE'});data=null;showLogin()});
window.addEventListener('beforeunload',e=>{if(data&&JSON.stringify(data)!==saved){e.preventDefault();e.returnValue=''}});

start();
}
</script>
</body>
</html>
